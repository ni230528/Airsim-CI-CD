name: CI

# Cheap checks first, expensive ones after. Every job here runs on a
# GitHub-hosted runner: no self-hosted machine, no GPU, no Unreal Engine.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      px4_msgs_ref:
        description: px4_msgs branch or tag to build the ROS 2 job against
        required: false
        default: release/1.16

# The automatic GITHUB_TOKEN gets read-only access. CI never writes to the
# repository; only the release workflow does.
permissions:
  contents: read

# A second push to the same ref cancels the first run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------
  # Tier 1 - seconds. Catches merge markers, broken YAML, broken docs.
  # ---------------------------------------------------------------------
  static_checks:
    name: Static checks and docs
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt

      - name: Install CI tooling
        run: python -m pip install --upgrade pip -r tools/ci/requirements.txt

      - name: Check repository text hygiene
        run: python tools/ci/check_repo_text.py

      - name: Validate workflow definitions
        run: python tools/ci/validate_ci_yaml.py

      - name: Byte-compile Python sources
        run: python -m compileall -q PythonClient tools/ci ros2/src

      - name: Build documentation
        run: mkdocs build --strict

  # ---------------------------------------------------------------------
  # Tier 2 - a couple of minutes. Proves the client is packageable AND
  # installable; building a wheel that cannot be imported is not a pass.
  # ---------------------------------------------------------------------
  python_client:
    name: Python client package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt

      - name: Install CI tooling
        run: python -m pip install --upgrade pip -r tools/ci/requirements.txt

      - name: Build sdist and wheel
        run: python -m build PythonClient

      - name: Install the wheel into a clean virtualenv and import it
        run: |
          python -m venv "${RUNNER_TEMP}/wheelcheck"
          "${RUNNER_TEMP}/wheelcheck/bin/python" -m pip install --quiet PythonClient/dist/*.whl
          "${RUNNER_TEMP}/wheelcheck/bin/python" -c "import cosysairsim; print(cosysairsim.__file__)"

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-client-dist
          path: PythonClient/dist/*
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Tier 3 - the part the old pipeline never covered: the ROS 2 packages
  # and their unit / node-level tests. Runs inside the official ROS
  # Humble container so the environment is pinned, not inherited from
  # whatever the GitHub runner image happens to ship.
  # ---------------------------------------------------------------------
  ros2_humble:
    name: ROS 2 Humble build and test
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base

    # px4_msgs is generated from the PX4 firmware tree and is not published
    # to any apt repository, so CI builds it from source. The layouts that
    # airsim_px4_offboard validates against match PX4 v1.16.
    env:
      PX4_MSGS_REF: ${{ inputs.px4_msgs_ref || 'release/1.16' }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and test tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3-pytest
          rm -rf /var/lib/apt/lists/*

      - name: Fetch px4_msgs (${{ inputs.px4_msgs_ref || 'release/1.16' }})
        run: |
          git clone --depth 1 --branch "${PX4_MSGS_REF}" \
            https://github.com/PX4/px4_msgs.git ros2/src/px4_msgs

      - name: Resolve ROS dependencies
        # Only the packages this job actually builds. Pointing rosdep at the
        # whole src/ would drag in airsim_ros_pkgs' PCL and MAVROS stack,
        # which needs a compiled AirLib and belongs in a heavier job.
        run: |
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install -y --ignore-src --rosdistro "${ROS_DISTRO}" \
            --from-paths \
              ros2/src/airsim_interfaces \
              ros2/src/airsim_px4_offboard \
              ros2/src/px4_msgs

      - name: Build workspace
        working-directory: ros2
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          colcon build \
            --packages-up-to airsim_px4_offboard px4_msgs \
            --event-handlers console_direct+

      - name: Run tests
        working-directory: ros2
        # colcon test exits 0 even when test cases fail; colcon test-result
        # is what actually turns a failing test into a red pipeline.
        run: |
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          source install/setup.bash
          colcon test \
            --packages-select airsim_px4_offboard \
            --event-handlers console_direct+
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-test-results
          path: |
            ros2/build/**/pytest.xml
            ros2/log/latest_test/**
          if-no-files-found: ignore
          retention-days: 14
